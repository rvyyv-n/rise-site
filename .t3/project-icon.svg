<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Rise Site project icon for T3 Code:
       The iconic Rise sunrise mark framed inside a clean browser window,
       distinguishing the website project from the Rise app while preserving
       the Reel dark palette and geometry. -->
  <defs>
    <radialGradient id="sun" gradientUnits="userSpaceOnUse" cx="226" cy="250" r="165">
      <stop offset="0" stop-color="#ffd392"/>
      <stop offset="0.42" stop-color="#f8a959"/>
      <stop offset="0.72" stop-color="#eb7b49"/>
      <stop offset="1" stop-color="#e0673f"/>
    </radialGradient>
    <radialGradient id="halo" gradientUnits="userSpaceOnUse" cx="256" cy="336" r="230">
      <stop offset="0" stop-color="#f8a959" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#f8a959" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <!-- Base tile in Reel dark canvas -->
  <rect width="512" height="512" rx="112" fill="#0b0a09"/>
  <!-- Browser top chrome bar -->
  <g clip-path="url(#tile)">
    <rect x="0" y="0" width="512" height="116" fill="#181512"/>
    <line x1="0" y1="116" x2="512" y2="116" stroke="#f3ede3" stroke-opacity="0.12" stroke-width="3"/>
    <!-- Window controls -->
    <circle cx="80" cy="62" r="13" fill="#f3ede3" fill-opacity="0.45"/>
    <circle cx="118" cy="62" r="13" fill="#f3ede3" fill-opacity="0.45"/>
    <circle cx="156" cy="62" r="13" fill="#f3ede3" fill-opacity="0.45"/>
    <!-- URL search pill with subtle globe symbol -->
    <rect x="194" y="44" width="238" height="36" rx="18" fill="#f3ede3" fill-opacity="0.09"/>
    <circle cx="218" cy="62" r="7" stroke="#f3ede3" stroke-opacity="0.4" stroke-width="2" fill="none"/>
    <ellipse cx="218" cy="62" rx="3.5" ry="7" stroke="#f3ede3" stroke-opacity="0.4" stroke-width="2" fill="none"/>
  </g>
  <!-- Sunrise viewport -->
  <g clip-path="url(#tile)">
    <circle cx="256" cy="336" r="230" fill="url(#halo)"/>
    <path d="M126 336 A130 130 0 0 1 386 336 Z" fill="url(#sun)"/>
    <path d="M68 336 H444 M160 388 H352" stroke="#f3ede3" stroke-width="18" stroke-linecap="round" fill="none"/>
  </g>
</svg>
