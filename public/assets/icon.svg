<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Rise's mark: a sun coming up over a horizon, on the Reel dark canvas.
       It is the sun and horizon of the Today card, cut down to what survives
       at 16px: a half disc, one line it rests on, and a shorter line below.
       The sun gradient is the sun token in tokens.css; the tile is the dark
       canvas colour and the lines are the dark ink colour. Android and Windows
       rasterise this file at build time, so it uses only gradients (no
       filters) for the glow. tools/make-icons.py mirrors the geometry. -->
  <defs>
    <radialGradient id="sun" gradientUnits="userSpaceOnUse" cx="226" cy="224" r="175">
      <stop offset="0" stop-color="#ffd392"/>
      <stop offset="0.42" stop-color="#f8a959"/>
      <stop offset="0.72" stop-color="#eb7b49"/>
      <stop offset="1" stop-color="#e0673f"/>
    </radialGradient>
    <radialGradient id="halo" gradientUnits="userSpaceOnUse" cx="256" cy="310" r="240">
      <stop offset="0" stop-color="#f8a959" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#f8a959" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0b0a09"/>
  <circle cx="256" cy="310" r="240" fill="url(#halo)" clip-path="url(#tile)"/>
  <path d="M116 310 A140 140 0 0 1 396 310 Z" fill="url(#sun)"/>
  <path d="M56 310 H456 M150 364 H362" stroke="#f3ede3" stroke-width="18" stroke-linecap="round" fill="none"/>
</svg>
