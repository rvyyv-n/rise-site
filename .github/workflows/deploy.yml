# Checks every push and pull request. Pushes to main, manual runs, and a new Rise
# release (repository_dispatch "rise-release", sent from diet-tracker) publish to
# Cloudflare Pages at getrise.pages.dev. The deploy is skipped until the Cloudflare
# secrets exist.
name: Check and deploy

on:
  # Docs and the local check scripts change nothing that ships.
  push:
    branches: [main]
    paths-ignore: &docs ["**.md", "docs/**", "dev/**", "scripts/shot.mjs", "scripts/check-looks.mjs"]
  pull_request:
    paths-ignore: *docs
  workflow_dispatch:
  repository_dispatch:
    types: [rise-release]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v7
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: env.CLOUDFLARE_API_TOKEN != ''
      - run: npm run build
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: cloudflare/wrangler-action@v3
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=getrise --branch=main
      - name: Check the deployed headers
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: node scripts/check-headers.mjs https://getrise.pages.dev
